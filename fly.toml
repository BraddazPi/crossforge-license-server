# fly.toml — optional Fly.io deploy (alternative to Render)
# fly launch --no-deploy && fly secrets import < .env && fly deploy

app = "crossforge-license"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "license_data"
  destination = "/data"

[env]
  CROSSFORGE_LICENSE_DB = "/data/licenses.db"
