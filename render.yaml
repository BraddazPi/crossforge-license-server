# Render Blueprint — CrossForge License Server
# See DEPLOY.md for env vars after first deploy.

services:
  - type: web
    name: crossforge-license
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CROSSFORGE_LICENSE_DB
        value: /data/licenses.db
      - key: CROSSFORGE_PUBLIC_URL
        value: https://crossforge-license.onrender.com
      - key: CROSSFORGE_LEGAL_SITE
        value: https://BraddazPi.github.io/crossforge-legal/legal
      - key: CROSSFORGE_BILLING_PORTAL
        value: https://BraddazPi.github.io/crossforge-legal/billing
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://BraddazPi.github.io/crossforge-legal/billing/index.html
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_WINDOWS
        sync: false
      - key: STRIPE_PRICE_MACOS
        sync: false
      - key: STRIPE_PRICE_ANDROID
        sync: false
      - key: STRIPE_PRICE_BUNDLE
        sync: false
    disk:
      name: crossforge-license-data
      mountPath: /data
      sizeGB: 1
