# Render Blueprint — CrossForge License Server
# Free tier: testing only (SQLite resets on redeploy). Production: use starter + disk below.

services:
  - type: web
    name: crossforge-license
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CROSSFORGE_LICENSE_DB
        value: /data/licenses.db
      - key: CROSSFORGE_PUBLIC_URL
        sync: false
      - key: CROSSFORGE_LEGAL_SITE
        sync: false
      - key: CROSSFORGE_BILLING_PORTAL
        sync: false
      - key: STRIPE_PORTAL_RETURN_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_WINDOWS
        sync: false
      - key: STRIPE_PRICE_MACOS
        sync: false
      - key: STRIPE_PRICE_ANDROID
        sync: false
      - key: STRIPE_PRICE_BUNDLE
        sync: false
    disk:
      name: crossforge-license-data
      mountPath: /data
      sizeGB: 1

# Set in Render dashboard after first deploy:
#   CROSSFORGE_PUBLIC_URL=https://crossforge-license.onrender.com
#   CROSSFORGE_LEGAL_SITE=https://YOURUSER.github.io/crossforge-legal/legal
#   CROSSFORGE_BILLING_PORTAL=https://YOURUSER.github.io/crossforge-legal/billing
#   STRIPE_PORTAL_RETURN_URL=same as billing portal
